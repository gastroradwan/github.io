name: Validate Public Web

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'CNAME'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check navigation, internal links, anchors and local assets
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path('.').resolve()
          html_files = sorted(Path('.').glob('*.html'))
          ids = {}
          refs = []
          errors = []

          class Parser(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source
                  self.page_ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.page_ids.add(attrs['id'])
                  for attr in ('href', 'src'):
                      value = attrs.get(attr)
                      if value:
                          refs.append((self.source, tag, attr, value.strip()))

          for path in html_files:
              parser = Parser(path)
              parser.feed(path.read_text(encoding='utf-8'))
              ids[path.name] = parser.page_ids

          ignored_schemes = ('mailto:', 'tel:', 'javascript:', 'data:')
          for source, tag, attr, value in refs:
              if not value or value.startswith(ignored_schemes):
                  continue
              if value.startswith(('http://', 'https://', '//')):
                  continue

              parsed = urlsplit(value)
              raw_path = unquote(parsed.path)
              fragment = unquote(parsed.fragment)

              if not raw_path:
                  target = source
              elif raw_path == '/':
                  target = Path('index.html')
              else:
                  target = (source.parent / raw_path).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(f'{source}: odkaz míří mimo web: {value}')
                      continue

              if raw_path and not target.exists():
                  errors.append(f'{source}: chybí cíl {value}')
                  continue

              if fragment:
                  target_name = target.name if target.suffix == '.html' else source.name
                  if target_name not in ids:
                      errors.append(f'{source}: nelze ověřit kotvu {value}')
                  elif fragment not in ids[target_name]:
                      errors.append(f'{source}: chybí kotva #{fragment} v {target_name}')

          required = [
              'index.html', 'sluzby.html', 'pro-firmy.html',
              'sprava-elektro-bezpecnosti.html', 'ezapp.html',
              'o-spolecnosti.html', 'poptavka.html',
              'prihlaseni.html', 'kontakt.html'
          ]
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              nav_start = text.find('<nav class="main-nav"')
              nav_end = text.find('</nav>', nav_start)
              if nav_start < 0 or nav_end < 0:
                  errors.append(f'{page}: chybí hlavní navigace')
                  continue
              nav_text = text[nav_start:nav_end]
              positions = []
              for target in required:
                  needle = f'href="{target}"'
                  count = nav_text.count(needle)
                  if count != 1:
                      errors.append(f'{page}: hlavní navigace musí obsahovat právě jednou {target} (nalezeno {count})')
                  else:
                      positions.append(nav_text.index(needle))
              if len(positions) == len(required) and positions != sorted(positions):
                  errors.append(f'{page}: hlavní navigace nemá schválené pořadí položek')
              nav_links = nav_text.count('<a ')
              if nav_links != len(required):
                  errors.append(f'{page}: hlavní navigace má {nav_links} odkazů, očekáváno {len(required)}')
              if 'navigation.css?v=4' not in text:
                  errors.append(f'{page}: nenačítá navigation.css?v=4')

          if errors:
              print('Nalezené chyby:')
              for error in errors:
                  print(f'  - {error}')
              raise SystemExit(1)

          print(f'Kontrola dokončena: {len(html_files)} HTML souborů, {len(refs)} odkazů a zdrojů bez chyby.')

      - name: Ensure CI did not modify repository files
        run: |
          if ! git diff --exit-code; then
            echo "ERROR: validační workflow nesmí měnit soubory."
            exit 1
          fi
